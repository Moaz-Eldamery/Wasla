# Lint and tests on every pull request (and on main after a merge).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Apps, auth and core (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build

  ai:
    name: AI service (lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  stack:
    name: Whole stack (docker compose smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build --detach --wait
      - name: /auth/* reaches the auth service without a session
        run: curl --fail --silent --show-error http://localhost:8080/auth/health
      - name: Core routes are refused without a session (auth check fails closed)
        run: |
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/health)
          echo "GET /health -> $code"
          test "$code" = "401"
      - name: Logs
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
