# Lint and tests on every pull request (and on main after a merge).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Apps, auth and core (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build

  database:
    name: Auth and core against a real database (migrations, e2e)
    runs-on: ubuntu-latest
    env:
      # Same fake passwords as .env.example. Each service's tests connect as
      # that service's own DB user (DATABASE_URL, set per step).
      MIGRATOR_DATABASE_URL: postgresql://wasla_migrator:fake-migrator-password@127.0.0.1:5432/wasla_clinical
      AI_MIGRATOR_DATABASE_URL: postgresql://wasla_migrator:fake-migrator-password@127.0.0.1:5432/wasla_ai
      SEED_DATABASE_URL: postgresql://wasla_migrator:fake-migrator-password@127.0.0.1:5432/wasla_clinical
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres (init.sh creates the databases, schemas and DB users)
        run: |
          docker run --detach --name postgres --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_PASSWORD=fake-postgres-password \
            --env MIGRATOR_DB_PASSWORD=fake-migrator-password \
            --env AUTH_DB_PASSWORD=fake-auth-password \
            --env CORE_DB_PASSWORD=fake-core-password \
            --env AI_DB_PASSWORD=fake-ai-password \
            --volume "$PWD/database/init.sh:/docker-entrypoint-initdb.d/init.sh:ro" \
            --volume "$PWD/database/ai/migrator_permissions.sql:/etc/wasla/ai-migrator-permissions.sql:ro" \
            pgvector/pgvector:pg16
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for Postgres
        # Over TCP: Postgres only listens there once init.sh has finished.
        run: timeout 120 bash -c 'until docker exec postgres pg_isready -h 127.0.0.1 -U postgres -d wasla_clinical; do sleep 2; done'
      - name: Apply migrations as wasla_migrator
        run: pnpm db:migrate
      - name: Apply AI migrations as wasla_migrator
        run: pnpm db:ai:migrate
      - name: Load the demo data (the tests must work alongside it)
        run: pnpm db:seed
      - name: Auth e2e tests as wasla_auth
        run: pnpm --filter @wasla/auth test:e2e
        env:
          DATABASE_URL: postgresql://wasla_auth:fake-auth-password@127.0.0.1:5432/wasla_clinical
      - name: Start private result storage
        run: |
          docker run --detach --name minio --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER=wasla-minio --env MINIO_ROOT_PASSWORD=fake-minio-password \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          timeout 120 bash -c 'until curl --fail --silent http://127.0.0.1:9000/minio/health/live; do sleep 2; done'
      - name: Core e2e tests as wasla_core
        run: pnpm --filter @wasla/core test:e2e
        env:
          DATABASE_URL: postgresql://wasla_core:fake-core-password@127.0.0.1:5432/wasla_clinical
          MINIO_ENDPOINT: http://127.0.0.1:9000
          MINIO_ACCESS_KEY: wasla-minio
          MINIO_SECRET_KEY: fake-minio-password
          MINIO_RESULTS_BUCKET: wasla-results
      - name: Postgres logs
        if: failure()
        run: docker logs postgres

  ai:
    name: AI service (lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  chatbot-integration:
    name: Core-to-AI chatbot integration (local mocks only)
    needs: [node, ai]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
        working-directory: services/ai
      - run: pnpm --filter @wasla/core test:integration

  stack:
    name: Whole stack (docker compose smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - name: Validate the production Compose overlay (configuration only)
        run: docker compose -f docker-compose.yml -f docker-compose.production.yml config --quiet
      - run: docker compose up --build --detach --wait
      - name: /auth/* reaches the auth service without a session
        run: curl --fail --silent --show-error http://localhost:8080/auth/health
      - name: Core routes are refused without a session (auth check fails closed)
        run: |
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/health)
          echo "GET /health -> $code"
          test "$code" = "401"
      - name: A patient signs up, logs in and reaches the core through the gateway
        run: |
          json='content-type: application/json'
          phone=+201000000099
          code=$(curl --fail --silent --show-error -X POST http://localhost:8080/auth/register -H "$json" \
            -d "{\"name\":\"CI Patient\",\"phone\":\"$phone\",\"password\":\"ci-password-1\"}" | jq -r .simulatedCode)
          curl --fail --silent --show-error -X POST http://localhost:8080/auth/verify-phone -H "$json" \
            -d "{\"phone\":\"$phone\",\"code\":\"$code\"}"
          token=$(curl --fail --silent --show-error -X POST http://localhost:8080/auth/login -H "$json" \
            -d "{\"phone\":\"$phone\",\"password\":\"ci-password-1\"}" | jq -r .token)
          curl --fail --silent --show-error http://localhost:8080/me/appointments -H "Authorization: Bearer $token"
      - name: Logs
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes

  deploy:
    name: Deploy main to the Wasla VM (SSH, build on VM)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [node, database, ai, chatbot-integration, stack]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" || { echo 'Missing DEPLOY_HOST secret'; exit 1; }
          test -n "$DEPLOY_USER" || { echo 'Missing DEPLOY_USER secret'; exit 1; }
          test -n "$DEPLOY_SSH_PRIVATE_KEY" || { echo 'Missing DEPLOY_SSH_PRIVATE_KEY secret'; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo 'Missing DEPLOY_KNOWN_HOSTS secret'; exit 1; }
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo 'DEPLOY_HOST must be an IPv4 address or DNS name'; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo 'DEPLOY_USER contains unsupported characters'; exit 1; }
      - name: Archive the merged source
        run: git archive --format=tar.gz --output "$RUNNER_TEMP/wasla-release.tar.gz" "$GITHUB_SHA"
      - name: Upload and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/wasla-deploy-key"
          known_hosts_file="$RUNNER_TEMP/wasla-known-hosts"
          archive="$RUNNER_TEMP/wasla-release.tar.gz"
          trap 'rm -f "$key_file" "$known_hosts_file" "$archive"' EXIT
          install -m 600 /dev/null "$key_file"
          install -m 600 /dev/null "$known_hosts_file"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"
          ssh-keygen -F "$DEPLOY_HOST" -f "$known_hosts_file" >/dev/null || { echo 'DEPLOY_KNOWN_HOSTS does not contain DEPLOY_HOST'; exit 1; }
          ssh_args=(-i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts_file")
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          release="/opt/wasla/releases/$GITHUB_SHA"
          remote_archive="/tmp/wasla-$GITHUB_SHA.tar.gz"
          ssh "${ssh_args[@]}" "$remote" "mkdir -p '$release'"
          scp "${ssh_args[@]}" "$archive" "$remote:$remote_archive"
          ssh "${ssh_args[@]}" "$remote" "tar -xzf '$remote_archive' -C '$release' && rm -f '$remote_archive' && chmod 750 '$release/ops/deploy-vm.sh' && '$release/ops/deploy-vm.sh'"
