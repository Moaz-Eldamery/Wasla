# Lint and tests on every pull request (and on main after a merge).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Apps, auth and core (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build

  database:
    name: Auth and core against a real database (migrations, e2e)
    runs-on: ubuntu-latest
    env:
      # Same fake passwords as .env.example. Each service's tests connect as
      # that service's own DB user (DATABASE_URL, set per step).
      MIGRATOR_DATABASE_URL: postgresql://wasla_migrator:fake-migrator-password@127.0.0.1:5432/wasla_clinical
      SEED_DATABASE_URL: postgresql://wasla_migrator:fake-migrator-password@127.0.0.1:5432/wasla_clinical
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres (init.sh creates the databases, schemas and DB users)
        run: |
          docker run --detach --name postgres --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_PASSWORD=fake-postgres-password \
            --env MIGRATOR_DB_PASSWORD=fake-migrator-password \
            --env AUTH_DB_PASSWORD=fake-auth-password \
            --env CORE_DB_PASSWORD=fake-core-password \
            --env AI_DB_PASSWORD=fake-ai-password \
            --volume "$PWD/database/init.sh:/docker-entrypoint-initdb.d/init.sh:ro" \
            pgvector/pgvector:pg16
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for Postgres
        # Over TCP: Postgres only listens there once init.sh has finished.
        run: timeout 120 bash -c 'until docker exec postgres pg_isready -h 127.0.0.1 -U postgres -d wasla_clinical; do sleep 2; done'
      - name: Apply migrations as wasla_migrator
        run: pnpm db:migrate
      - name: Auth e2e tests as wasla_auth
        run: pnpm --filter @wasla/auth test:e2e
        env:
          DATABASE_URL: postgresql://wasla_auth:fake-auth-password@127.0.0.1:5432/wasla_clinical
      - name: Core e2e tests as wasla_core
        run: pnpm --filter @wasla/core test:e2e
        env:
          DATABASE_URL: postgresql://wasla_core:fake-core-password@127.0.0.1:5432/wasla_clinical
      - name: Postgres logs
        if: failure()
        run: docker logs postgres

  ai:
    name: AI service (lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  stack:
    name: Whole stack (docker compose smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build --detach --wait
      - name: /auth/* reaches the auth service without a session
        run: curl --fail --silent --show-error http://localhost:8080/auth/health
      - name: Core routes are refused without a session (auth check fails closed)
        run: |
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/health)
          echo "GET /health -> $code"
          test "$code" = "401"
      - name: A patient signs up, logs in and reaches the core through the gateway
        run: |
          json='content-type: application/json'
          phone=+201000000099
          code=$(curl --fail --silent --show-error -X POST http://localhost:8080/auth/register -H "$json" \
            -d "{\"name\":\"CI Patient\",\"phone\":\"$phone\",\"password\":\"ci-password-1\"}" | jq -r .simulatedCode)
          curl --fail --silent --show-error -X POST http://localhost:8080/auth/verify-phone -H "$json" \
            -d "{\"phone\":\"$phone\",\"code\":\"$code\"}"
          token=$(curl --fail --silent --show-error -X POST http://localhost:8080/auth/login -H "$json" \
            -d "{\"phone\":\"$phone\",\"password\":\"ci-password-1\"}" | jq -r .token)
          curl --fail --silent --show-error http://localhost:8080/me/appointments -H "Authorization: Bearer $token"
      - name: Logs
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
