openapi: 3.1.0
info:
  title: Wasla API, admin draft
  version: 0.1.0-draft
  description: |
    **Draft, not agreed yet.** The endpoints the admin screens (KAN-20) are built against:
    staff and roles, departments and clinics, statistics and the audit log.

    - The backend cards take them from here: staff and hospital setup (KAN-36), statistics (KAN-39)
      and the audit log (KAN-62). Each one moves its endpoints into `openapi.yaml`, changing them
      where it needs to, and deletes them from this file. The dashboard then switches its types to the contract.
    - Every rule at the top of `openapi.yaml` applies here too: UTC times, Cairo `date` parameters,
      `{ ar, en }` text, the `Error` body, 404 for records that aren't the caller's, 403 for the wrong role.
    - Shared schemas and responses come from `openapi.yaml`.
    - **No medical records:** nothing here returns visit notes, results, diagnoses or patient names.
    - `pnpm mock` serves this file together with `openapi.yaml`.

servers:
  - url: http://localhost:8080
    description: Local gateway (docker compose)
  - url: http://localhost:4010
    description: Mock server (pnpm mock)

security:
  - session: []

tags:
  - name: Staff
  - name: Hospital setup
  - name: Statistics
  - name: Audit log

paths:
  # ---------------------------------------------------------------- staff (auth service)
  /auth/staff:
    get:
      tags: [Staff]
      summary: List staff accounts
      description: Every staff account, active and inactive, sorted by name. Patients are never listed.
      operationId: listStaff
      x-service: auth
      x-roles: [ADMIN]
      parameters:
        - name: q
          in: query
          description: Part of a name or phone number
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          description: Only active or only inactive accounts; both when left out
          schema:
            type: string
            enum: [active, inactive]
      responses:
        '200':
          description: The matching staff
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffMember'
              example:
                - { id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000001, name: Demo Admin, phone: '+201000000001', roles: [ADMIN], active: true, createdAt: '2026-10-01T08:00:00Z' }
                - { id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000011, name: Dr. Rania Mostafa, phone: '+201000000011', roles: [DOCTOR], active: true, createdAt: '2026-10-01T08:00:00Z' }
                - { id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000012, name: Dr. Karim Adel, phone: '+201000000012', roles: [DOCTOR, ADMIN], active: true, createdAt: '2026-10-01T08:00:00Z' }
                - { id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000013, name: Dr. Salma Fawzy, phone: '+201000000013', roles: [DOCTOR], active: true, createdAt: '2026-10-02T08:00:00Z' }
                - { id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000014, name: Dr. Omar Nabil, phone: '+201000000014', roles: [DOCTOR], active: false, createdAt: '2026-10-02T08:00:00Z' }
                - { id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000021, name: Nadia Hassan, phone: '+201000000021', roles: [RECEPTIONIST], active: true, createdAt: '2026-10-03T08:00:00Z' }
                - { id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000022, name: Youssef Samir, phone: '+201000000022', roles: [RECEPTIONIST], active: true, createdAt: '2026-10-03T08:00:00Z' }
                - { id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000031, name: Mona Farouk, phone: '+201000000031', roles: [LAB], active: true, createdAt: '2026-10-04T08:00:00Z' }
                - { id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000032, name: Hany Ibrahim, phone: '+201000000032', roles: [LAB], active: true, createdAt: '2026-10-04T08:00:00Z' }
        '400':
          $ref: '../openapi.yaml#/components/responses/ValidationError'
        '401':
          $ref: '../openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../openapi.yaml#/components/responses/Forbidden'
    post:
      tags: [Staff]
      summary: Add a staff member
      description: |
        Creates an active staff account and a temporary password. The password is returned once,
        in this response only, for the admin to hand over in person; the auth service stores just its hash.
        Staff don't verify their phone with a code (the admin created the account).
      operationId: createStaff
      x-service: auth
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewStaffRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewStaffResponse'
              example:
                staff: { id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000099, name: Laila Mahmoud, phone: '+201000000099', roles: [RECEPTIONIST], active: true, createdAt: '2026-11-06T10:30:00Z' }
                temporaryPassword: river-amber-4729
        '400':
          $ref: '../openapi.yaml#/components/responses/ValidationError'
        '401':
          $ref: '../openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../openapi.yaml#/components/responses/Forbidden'
        '409':
          description: '`PHONE_TAKEN`: another account (staff or patient) uses this number'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/Error'

  /auth/staff/{staffId}/roles:
    put:
      tags: [Staff]
      summary: Change a staff member's roles
      description: |
        Replaces the roles. Takes effect on the person's next request (the forward-auth check reads roles each time).
        An admin can't remove their own `ADMIN` role (403), so there is always someone who can undo a change.
      operationId: setStaffRoles
      x-service: auth
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/StaffId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffRolesRequest'
      responses:
        '200':
          description: The updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
              example: { id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000011, name: Dr. Rania Mostafa, phone: '+201000000011', roles: [DOCTOR, RECEPTIONIST], active: true, createdAt: '2026-10-01T08:00:00Z' }
        '400':
          $ref: '../openapi.yaml#/components/responses/ValidationError'
        '401':
          $ref: '../openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../openapi.yaml#/components/responses/NotFound'

  /auth/staff/{staffId}/deactivate:
    post:
      tags: [Staff]
      summary: Deactivate a staff member
      description: |
        The account can't log in any more and **every session it has is revoked at once**, so the next
        request from any of its devices gets 401. Its past records keep its name. An admin can't deactivate themselves (403).
        Doing it twice is harmless.
      operationId: deactivateStaff
      x-service: auth
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/StaffId'
      responses:
        '200':
          description: The updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
              example: { id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000022, name: Youssef Samir, phone: '+201000000022', roles: [RECEPTIONIST], active: false, createdAt: '2026-10-03T08:00:00Z' }
        '401':
          $ref: '../openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../openapi.yaml#/components/responses/NotFound'

  /auth/staff/{staffId}/reactivate:
    post:
      tags: [Staff]
      summary: Reactivate a staff member
      description: The account can log in again with its existing password. Doing it twice is harmless.
      operationId: reactivateStaff
      x-service: auth
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/StaffId'
      responses:
        '200':
          description: The updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
              example: { id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000014, name: Dr. Omar Nabil, phone: '+201000000014', roles: [DOCTOR], active: true, createdAt: '2026-10-02T08:00:00Z' }
        '401':
          $ref: '../openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../openapi.yaml#/components/responses/NotFound'

  # ---------------------------------------------------------------- hospital setup (core)
  /admin/departments:
    get:
      tags: [Hospital setup]
      summary: Departments with their clinics and assigned staff
      description: |
        Everything, inactive included (`GET /departments` is the bookable view and leaves inactive ones out).
        Departments come in a fixed order (clinical first, then lab, then radiology, each by English name),
        the same order the statistics use.
      operationId: listAdminDepartments
      x-service: core
      x-roles: [ADMIN]
      responses:
        '200':
          description: All departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminDepartment'
              example:
                - id: 1d000000-0000-4000-8000-000000000001
                  kind: CLINICAL
                  name: { en: Internal Medicine, ar: الباطنة }
                  active: true
                  clinics:
                    - id: 1c000000-0000-4000-8000-000000000011
                      departmentId: 1d000000-0000-4000-8000-000000000001
                      name: { en: Internal Medicine Clinic 1, ar: عيادة الباطنة ١ }
                      building: A
                      floor: '1'
                      directions: { en: First floor, left of the lift, ar: الدور الأول، يسار المصعد }
                      active: true
                      staff:
                        - { id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000011, name: Dr. Rania Mostafa, roles: [DOCTOR], active: true }
                        - { id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000021, name: Nadia Hassan, roles: [RECEPTIONIST], active: true }
                    - id: 1c000000-0000-4000-8000-000000000012
                      departmentId: 1d000000-0000-4000-8000-000000000001
                      name: { en: Internal Medicine Clinic 2, ar: عيادة الباطنة ٢ }
                      building: A
                      floor: '1'
                      directions: { en: First floor, end of the corridor, ar: الدور الأول، آخر الممر }
                      active: false
                      staff: []
                - id: 1d000000-0000-4000-8000-000000000004
                  kind: CLINICAL
                  name: { en: Pediatrics, ar: طب الأطفال }
                  active: true
                  clinics:
                    - id: 1c000000-0000-4000-8000-000000000041
                      departmentId: 1d000000-0000-4000-8000-000000000004
                      name: { en: Pediatrics Clinic 1, ar: عيادة الأطفال ١ }
                      building: A
                      floor: '2'
                      directions: { en: 'Second floor, right of the lift', ar: الدور الثاني، يمين المصعد }
                      active: true
                      staff: []
                - id: 1d000000-0000-4000-8000-000000000002
                  kind: CLINICAL
                  name: { en: Cardiology, ar: أمراض القلب }
                  active: true
                  clinics:
                    - id: 1c000000-0000-4000-8000-000000000021
                      departmentId: 1d000000-0000-4000-8000-000000000002
                      name: { en: Cardiology Clinic, ar: عيادة القلب }
                      building: B
                      floor: '1'
                      directions: { en: 'Building B, first floor, first door on the right', ar: المبنى ب، الدور الأول، أول باب يمينًا }
                      active: true
                      staff:
                        - { id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000012, name: Dr. Karim Adel, roles: [DOCTOR, ADMIN], active: true }
                        - { id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000014, name: Dr. Omar Nabil, roles: [DOCTOR], active: false }
                - id: 1d000000-0000-4000-8000-000000000005
                  kind: CLINICAL
                  name: { en: Orthopedics, ar: العظام }
                  active: true
                  clinics:
                    - id: 1c000000-0000-4000-8000-000000000051
                      departmentId: 1d000000-0000-4000-8000-000000000005
                      name: { en: Orthopedics Clinic, ar: عيادة العظام }
                      building: B
                      floor: '2'
                      directions: { en: 'Building B, second floor, opposite the lift', ar: المبنى ب، الدور الثاني، مقابل المصعد }
                      active: true
                      staff: []
                - id: 1d000000-0000-4000-8000-000000000003
                  kind: CLINICAL
                  name: { en: Dermatology, ar: الجلدية }
                  active: false
                  clinics:
                    - id: 1c000000-0000-4000-8000-000000000031
                      departmentId: 1d000000-0000-4000-8000-000000000003
                      name: { en: Dermatology Clinic, ar: عيادة الجلدية }
                      building: B
                      floor: '3'
                      directions: { en: 'Building B, third floor, left of the lift', ar: المبنى ب، الدور الثالث، يسار المصعد }
                      active: true
                      staff: []
                - id: 1d000000-0000-4000-8000-000000000006
                  kind: CLINICAL
                  name: { en: 'Ear, Nose and Throat', ar: الأنف والأذن والحنجرة }
                  active: true
                  clinics:
                    - id: 1c000000-0000-4000-8000-000000000061
                      departmentId: 1d000000-0000-4000-8000-000000000006
                      name: { en: ENT Clinic, ar: عيادة الأنف والأذن }
                      building: C
                      floor: '1'
                      directions: { en: 'Building C, first floor, end of the corridor', ar: المبنى ج، الدور الأول، آخر الممر }
                      active: true
                      staff: []
                - id: 1d000000-0000-4000-8000-000000000007
                  kind: LAB
                  name: { en: Laboratory, ar: المعمل }
                  active: true
                  clinics:
                    - id: 1c000000-0000-4000-8000-000000000071
                      departmentId: 1d000000-0000-4000-8000-000000000007
                      name: { en: Main Laboratory, ar: المعمل الرئيسي }
                      building: C
                      floor: Ground
                      directions: { en: 'Building C, ground floor, next to the pharmacy', ar: المبنى ج، الدور الأرضي، بجوار الصيدلية }
                      active: true
                      staff:
                        - { id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000031, name: Mona Farouk, roles: [LAB], active: true }
                - id: 1d000000-0000-4000-8000-000000000008
                  kind: RADIOLOGY
                  name: { en: Radiology, ar: الأشعة }
                  active: true
                  clinics:
                    - id: 1c000000-0000-4000-8000-000000000081
                      departmentId: 1d000000-0000-4000-8000-000000000008
                      name: { en: Radiology Unit, ar: قسم الأشعة }
                      building: C
                      floor: Basement
                      directions: { en: 'Building C, basement, by the stairs', ar: المبنى ج، البدروم، بجوار السلم }
                      active: true
                      staff: []
        '401':
          $ref: '../openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../openapi.yaml#/components/responses/Forbidden'
    post:
      tags: [Hospital setup]
      summary: Add a department
      operationId: createDepartment
      x-service: core
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDepartmentRequest'
      responses:
        '201':
          description: The new department, active and with no clinics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDepartment'
              example: { id: 1d000000-0000-4000-8000-000000000009, kind: CLINICAL, name: { en: Ophthalmology, ar: الرمد }, active: true, clinics: [] }
        '400':
          $ref: '../openapi.yaml#/components/responses/ValidationError'
        '401':
          $ref: '../openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../openapi.yaml#/components/responses/Forbidden'

  /admin/departments/{departmentId}:
    put:
      tags: [Hospital setup]
      summary: Rename a department
      description: The kind (clinical, lab, radiology) is fixed once created.
      operationId: updateDepartment
      x-service: core
      x-roles: [ADMIN]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/DepartmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentNameRequest'
      responses:
        '200':
          description: The updated department
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDepartment'
              example: { id: 1d000000-0000-4000-8000-000000000002, kind: CLINICAL, name: { en: Cardiology, ar: أمراض القلب }, active: true, clinics: [] }
        '400':
          $ref: '../openapi.yaml#/components/responses/ValidationError'
        '401':
          $ref: '../openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../openapi.yaml#/components/responses/NotFound'

  /admin/departments/{departmentId}/deactivate:
    post:
      tags: [Hospital setup]
      summary: Deactivate a department
      description: |
        The department and all its clinics stop being bookable (they leave `GET /departments`), whatever
        each clinic's own setting. Existing appointments keep it, and past ones still show it.
      operationId: deactivateDepartment
      x-service: core
      x-roles: [ADMIN]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/DepartmentId'
      responses:
        '200':
          description: The updated department
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDepartment'
              example: { id: 1d000000-0000-4000-8000-000000000003, kind: CLINICAL, name: { en: Dermatology, ar: الجلدية }, active: false, clinics: [] }
        '401':
          $ref: '../openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../openapi.yaml#/components/responses/NotFound'

  /admin/departments/{departmentId}/reactivate:
    post:
      tags: [Hospital setup]
      summary: Reactivate a department
      description: Its active clinics become bookable again; inactive clinics stay inactive.
      operationId: reactivateDepartment
      x-service: core
      x-roles: [ADMIN]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/DepartmentId'
      responses:
        '200':
          description: The updated department
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDepartment'
              example: { id: 1d000000-0000-4000-8000-000000000003, kind: CLINICAL, name: { en: Dermatology, ar: الجلدية }, active: true, clinics: [] }
        '401':
          $ref: '../openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../openapi.yaml#/components/responses/NotFound'

  /admin/departments/{departmentId}/clinics:
    post:
      tags: [Hospital setup]
      summary: Add a clinic to a department
      operationId: createClinic
      x-service: core
      x-roles: [ADMIN]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/DepartmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClinicRequest'
      responses:
        '201':
          description: The new clinic, active and with nobody assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminClinic'
              example:
                id: 1c000000-0000-4000-8000-000000000099
                departmentId: 1d000000-0000-4000-8000-000000000002
                name: { en: Cardiology Clinic 2, ar: عيادة القلب ٢ }
                building: B
                floor: '1'
                directions: { en: 'Building B, first floor, second door on the right', ar: المبنى ب، الدور الأول، ثاني باب يمينًا }
                active: true
                staff: []
        '400':
          $ref: '../openapi.yaml#/components/responses/ValidationError'
        '401':
          $ref: '../openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../openapi.yaml#/components/responses/NotFound'

  /admin/clinics/{clinicId}:
    put:
      tags: [Hospital setup]
      summary: Edit a clinic
      description: Name, building, floor and directions. Patients see the change on their next look; booked appointments keep the clinic.
      operationId: updateClinic
      x-service: core
      x-roles: [ADMIN]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/ClinicId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClinicRequest'
      responses:
        '200':
          description: The updated clinic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminClinic'
        '400':
          $ref: '../openapi.yaml#/components/responses/ValidationError'
        '401':
          $ref: '../openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../openapi.yaml#/components/responses/NotFound'

  /admin/clinics/{clinicId}/deactivate:
    post:
      tags: [Hospital setup]
      summary: Deactivate a clinic
      description: No new bookings (its open slots stop being offered). Existing appointments keep it, and past ones still show it.
      operationId: deactivateClinic
      x-service: core
      x-roles: [ADMIN]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/ClinicId'
      responses:
        '200':
          description: The updated clinic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminClinic'
        '401':
          $ref: '../openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../openapi.yaml#/components/responses/NotFound'

  /admin/clinics/{clinicId}/reactivate:
    post:
      tags: [Hospital setup]
      summary: Reactivate a clinic
      description: Bookable again, unless its department is inactive.
      operationId: reactivateClinic
      x-service: core
      x-roles: [ADMIN]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/ClinicId'
      responses:
        '200':
          description: The updated clinic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminClinic'
        '401':
          $ref: '../openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../openapi.yaml#/components/responses/NotFound'

  /admin/clinics/{clinicId}/staff/{staffId}:
    put:
      tags: [Hospital setup]
      summary: Assign a staff member to a clinic
      description: |
        Doctors, receptionists and lab staff work only in the clinics they're assigned to.
        Assigning someone already assigned is harmless. Inactive or admin-only accounts can't be assigned (400).
      operationId: assignClinicStaff
      x-service: core
      x-roles: [ADMIN]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/StaffId'
      responses:
        '200':
          description: The clinic with its updated staff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminClinic'
        '400':
          $ref: '../openapi.yaml#/components/responses/ValidationError'
        '401':
          $ref: '../openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../openapi.yaml#/components/responses/NotFound'
    delete:
      tags: [Hospital setup]
      summary: Remove a staff member from a clinic
      description: Their past and booked appointments in the clinic are unchanged. Removing someone not assigned is harmless.
      operationId: unassignClinicStaff
      x-service: core
      x-roles: [ADMIN]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/StaffId'
      responses:
        '200':
          description: The clinic with its updated staff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminClinic'
        '401':
          $ref: '../openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../openapi.yaml#/components/responses/NotFound'

  # ---------------------------------------------------------------- statistics (core)
  /admin/statistics:
    get:
      tags: [Statistics]
      summary: Visits, wait times and no-shows per day
      description: |
        Counts and averages only, never patients. Days are Cairo calendar days.
        - **Visits:** appointments that reached `COMPLETED`, per clinical department.
        - **Average wait:** minutes from check-in to the consultation starting, over the visits that started that day.
        - **No-show rate:** `NO_SHOW` ÷ appointments due that day that weren't cancelled (0 to 1).
        A value is `null` when there is nothing to measure (no appointments, hospital closed, or a day still to come);
        the screen shows "Not available", never 0. A real zero is `0`.
      operationId: getStatistics
      x-service: core
      x-roles: [ADMIN]
      parameters:
        - name: from
          in: query
          required: true
          description: First Cairo day, `YYYY-MM-DD`
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Last Cairo day, `YYYY-MM-DD`; at most 92 days after `from`
          schema:
            type: string
            format: date
        - name: departmentId
          in: query
          description: One clinical department; all of them when left out
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: One entry per day from `from` to `to`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statistics'
              example:
                from: '2026-10-31'
                to: '2026-11-06'
                departmentId: null
                departments:
                  - { id: 1d000000-0000-4000-8000-000000000001, name: { en: Internal Medicine, ar: الباطنة } }
                  - { id: 1d000000-0000-4000-8000-000000000004, name: { en: Pediatrics, ar: طب الأطفال } }
                  - { id: 1d000000-0000-4000-8000-000000000002, name: { en: Cardiology, ar: أمراض القلب } }
                  - { id: 1d000000-0000-4000-8000-000000000005, name: { en: Orthopedics, ar: العظام } }
                  - { id: 1d000000-0000-4000-8000-000000000003, name: { en: Dermatology, ar: الجلدية } }
                  - { id: 1d000000-0000-4000-8000-000000000006, name: { en: 'Ear, Nose and Throat', ar: الأنف والأذن والحنجرة } }
                days:
                  - date: '2026-10-31'
                    visits: [{ departmentId: 1d000000-0000-4000-8000-000000000001, count: 41 }, { departmentId: 1d000000-0000-4000-8000-000000000004, count: 33 }, { departmentId: 1d000000-0000-4000-8000-000000000002, count: 18 }, { departmentId: 1d000000-0000-4000-8000-000000000005, count: 22 }, { departmentId: 1d000000-0000-4000-8000-000000000003, count: 27 }, { departmentId: 1d000000-0000-4000-8000-000000000006, count: 19 }]
                    averageWaitMinutes: 23.4
                    noShowRate: 0.081
                  - date: '2026-11-01'
                    visits: [{ departmentId: 1d000000-0000-4000-8000-000000000001, count: 46 }, { departmentId: 1d000000-0000-4000-8000-000000000004, count: 38 }, { departmentId: 1d000000-0000-4000-8000-000000000002, count: 21 }, { departmentId: 1d000000-0000-4000-8000-000000000005, count: 24 }, { departmentId: 1d000000-0000-4000-8000-000000000003, count: 25 }, { departmentId: 1d000000-0000-4000-8000-000000000006, count: 20 }]
                    averageWaitMinutes: 27.9
                    noShowRate: 0.094
                  - date: '2026-11-02'
                    visits: [{ departmentId: 1d000000-0000-4000-8000-000000000001, count: 44 }, { departmentId: 1d000000-0000-4000-8000-000000000004, count: 35 }, { departmentId: 1d000000-0000-4000-8000-000000000002, count: 19 }, { departmentId: 1d000000-0000-4000-8000-000000000005, count: 23 }, { departmentId: 1d000000-0000-4000-8000-000000000003, count: 28 }, { departmentId: 1d000000-0000-4000-8000-000000000006, count: 17 }]
                    averageWaitMinutes: 25.1
                    noShowRate: 0.072
                  - date: '2026-11-03'
                    visits: [{ departmentId: 1d000000-0000-4000-8000-000000000001, count: 39 }, { departmentId: 1d000000-0000-4000-8000-000000000004, count: 31 }, { departmentId: 1d000000-0000-4000-8000-000000000002, count: 20 }, { departmentId: 1d000000-0000-4000-8000-000000000005, count: 21 }, { departmentId: 1d000000-0000-4000-8000-000000000003, count: 24 }, { departmentId: 1d000000-0000-4000-8000-000000000006, count: 18 }]
                    averageWaitMinutes: 21.6
                    noShowRate: 0.066
                  - date: '2026-11-04'
                    visits: [{ departmentId: 1d000000-0000-4000-8000-000000000001, count: 48 }, { departmentId: 1d000000-0000-4000-8000-000000000004, count: 36 }, { departmentId: 1d000000-0000-4000-8000-000000000002, count: 23 }, { departmentId: 1d000000-0000-4000-8000-000000000005, count: 25 }, { departmentId: 1d000000-0000-4000-8000-000000000003, count: 26 }, { departmentId: 1d000000-0000-4000-8000-000000000006, count: 21 }]
                    averageWaitMinutes: 31.2
                    noShowRate: 0.103
                  - date: '2026-11-05'
                    visits: [{ departmentId: 1d000000-0000-4000-8000-000000000001, count: 37 }, { departmentId: 1d000000-0000-4000-8000-000000000004, count: 30 }, { departmentId: 1d000000-0000-4000-8000-000000000002, count: 17 }, { departmentId: 1d000000-0000-4000-8000-000000000005, count: 20 }, { departmentId: 1d000000-0000-4000-8000-000000000003, count: 22 }, { departmentId: 1d000000-0000-4000-8000-000000000006, count: 16 }]
                    averageWaitMinutes: 19.8
                    noShowRate: 0.058
                  - date: '2026-11-06'
                    visits: null
                    averageWaitMinutes: null
                    noShowRate: null
                totals:
                  visits: 1031
                  averageWaitMinutes: 24.9
                  noShowRate: 0.079
        '400':
          $ref: '../openapi.yaml#/components/responses/ValidationError'
        '401':
          $ref: '../openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../openapi.yaml#/components/responses/Forbidden'

  # ---------------------------------------------------------------- audit log (core)
  /admin/audit-log:
    get:
      tags: [Audit log]
      summary: Search the audit log
      description: |
        Newest first, 50 at a time. Read-only: there is no endpoint that edits or deletes an entry.
        Entries say who did what to which record and whether it worked. They never carry medical content,
        passwords, tokens or codes.
      operationId: searchAuditLog
      x-service: core
      x-roles: [ADMIN]
      parameters:
        - name: who
          in: query
          description: Part of the actor's name or phone number
          schema:
            type: string
            maxLength: 100
        - name: action
          in: query
          schema:
            $ref: '#/components/schemas/AuditAction'
        - name: from
          in: query
          description: First Cairo day, `YYYY-MM-DD`
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Last Cairo day, `YYYY-MM-DD`
          schema:
            type: string
            format: date
        - name: cursor
          in: query
          description: '`nextCursor` from the previous page'
          schema:
            type: string
      responses:
        '200':
          description: One page of entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
              example:
                nextCursor: null
                entries:
                  - { id: '10452', occurredAt: '2026-11-06T08:21:14Z', actor: { id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000001, name: Demo Admin, type: STAFF }, action: STAFF_ROLES_CHANGED, outcome: SUCCESS, entityType: ACCOUNT, entityId: 6f1c2a10-1d1e-4c3a-9a51-0a0000000011, ip: 10.0.4.12 }
                  - { id: '10451', occurredAt: '2026-11-06T08:19:02Z', actor: { id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000011, name: Dr. Rania Mostafa, type: STAFF }, action: RESULT_RELEASED, outcome: SUCCESS, entityType: TEST_ORDER, entityId: 7a1b0c2d-3e4f-4a5b-8c6d-7e8f9a0b1c2d, ip: 10.0.4.31 }
                  - { id: '10450', occurredAt: '2026-11-06T08:17:45Z', actor: { id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000021, name: Nadia Hassan, type: STAFF }, action: ACCESS_DENIED, outcome: DENIED, entityType: VISIT_NOTES, entityId: 3c2d1e0f-9a8b-4c7d-8e6f-5a4b3c2d1e0f, ip: 10.0.4.18 }
                  - { id: '10449', occurredAt: '2026-11-06T08:12:30Z', actor: null, action: LOGIN_FAILED, outcome: FAILED, entityType: null, entityId: null, ip: 41.33.12.7 }
                  - { id: '10448', occurredAt: '2026-11-06T08:05:11Z', actor: { id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000031, name: Mona Farouk, type: STAFF }, action: RESULT_UPLOADED, outcome: SUCCESS, entityType: TEST_ORDER, entityId: 7a1b0c2d-3e4f-4a5b-8c6d-7e8f9a0b1c2d, ip: 10.0.4.40 }
                  - { id: '10447', occurredAt: '2026-11-06T07:58:03Z', actor: { id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000011, name: Dr. Rania Mostafa, type: STAFF }, action: NOTES_VIEWED, outcome: SUCCESS, entityType: VISIT_NOTES, entityId: 3c2d1e0f-9a8b-4c7d-8e6f-5a4b3c2d1e0f, ip: 10.0.4.31 }
                  - { id: '10446', occurredAt: '2026-11-06T07:41:27Z', actor: { id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000021, name: Nadia Hassan, type: STAFF }, action: CHECK_IN, outcome: SUCCESS, entityType: APPOINTMENT, entityId: 9e8d7c6b-5a4f-4e3d-8c2b-1a0f9e8d7c6b, ip: 10.0.4.18 }
                  - { id: '10445', occurredAt: '2026-11-06T07:30:55Z', actor: { id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000006, name: Demo Patient, type: PATIENT }, action: APPOINTMENT_BOOKED, outcome: SUCCESS, entityType: APPOINTMENT, entityId: 9e8d7c6b-5a4f-4e3d-8c2b-1a0f9e8d7c6b, ip: 156.204.3.88 }
