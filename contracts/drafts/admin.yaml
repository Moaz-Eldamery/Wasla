components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: The opaque session token from `POST /auth/login`.

  parameters:
    StaffId:
      name: staffId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    StaffMember:
      type: object
      required: [id, name, phone, roles, active, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          $ref: '../openapi.yaml#/components/schemas/Phone'
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '../openapi.yaml#/components/schemas/StaffRole'
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    NewStaffRequest:
      type: object
      required: [name, phone, roles]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          $ref: '../openapi.yaml#/components/schemas/Phone'
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '../openapi.yaml#/components/schemas/StaffRole'

    NewStaffResponse:
      type: object
      required: [staff, temporaryPassword]
      properties:
        staff:
          $ref: '#/components/schemas/StaffMember'
        temporaryPassword:
          type: string
          description: Shown to the admin once. Never returned again and never logged.

    StaffRolesRequest:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '../openapi.yaml#/components/schemas/StaffRole'

    AdminDepartment:
      type: object
      required: [id, kind, name, active, clinics]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '../openapi.yaml#/components/schemas/DepartmentKind'
        name:
          $ref: '../openapi.yaml#/components/schemas/LocalizedText'
        active:
          type: boolean
        clinics:
          type: array
          description: Inactive ones included, by English name
          items:
            $ref: '#/components/schemas/AdminClinic'

    AdminClinic:
      type: object
      required: [id, departmentId, name, building, floor, directions, active, staff]
      properties:
        id:
          type: string
          format: uuid
        departmentId:
          type: string
          format: uuid
        name:
          $ref: '../openapi.yaml#/components/schemas/LocalizedText'
        building:
          type: string
        floor:
          type: string
        directions:
          $ref: '../openapi.yaml#/components/schemas/LocalizedText'
        active:
          type: boolean
          description: The clinic's own setting. It is bookable only when it and its department are both active.
        staff:
          type: array
          description: Everyone assigned, by name
          items:
            $ref: '#/components/schemas/AssignedStaff'

    AssignedStaff:
      type: object
      required: [id, name, roles, active]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        roles:
          type: array
          items:
            $ref: '../openapi.yaml#/components/schemas/StaffRole'
        active:
          type: boolean

    NewDepartmentRequest:
      type: object
      required: [kind, name]
      properties:
        kind:
          $ref: '../openapi.yaml#/components/schemas/DepartmentKind'
        name:
          $ref: '#/components/schemas/RequiredText'

    DepartmentNameRequest:
      type: object
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/RequiredText'

    ClinicRequest:
      type: object
      required: [name, building, floor, directions]
      properties:
        name:
          $ref: '#/components/schemas/RequiredText'
        building:
          type: string
          minLength: 1
          maxLength: 40
        floor:
          type: string
          minLength: 1
          maxLength: 40
        directions:
          $ref: '#/components/schemas/RequiredText'

    RequiredText:
      type: object
      description: '`{ ar, en }` where both sides are filled in (1 to 200 characters)'
      required: [ar, en]
      properties:
        ar:
          type: string
          minLength: 1
          maxLength: 200
        en:
          type: string
          minLength: 1
          maxLength: 200

    Statistics:
      type: object
      required: [from, to, departmentId, departments, days, totals]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        departmentId:
          type: [string, 'null']
          format: uuid
          description: The department filter, or null for all
        departments:
          type: array
          description: The clinical departments counted, in the fixed order of `GET /admin/departments`. Inactive ones are included while they have visits in the range.
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
                format: uuid
              name:
                $ref: '../openapi.yaml#/components/schemas/LocalizedText'
        days:
          type: array
          items:
            $ref: '#/components/schemas/StatisticsDay'
        totals:
          type: object
          description: The whole range. Wait and no-show rate are weighted by the day's appointments, not an average of the days.
          required: [visits, averageWaitMinutes, noShowRate]
          properties:
            visits:
              type: [integer, 'null']
              minimum: 0
            averageWaitMinutes:
              type: [number, 'null']
              minimum: 0
            noShowRate:
              type: [number, 'null']
              minimum: 0
              maximum: 1

    StatisticsDay:
      type: object
      required: [date, visits, averageWaitMinutes, noShowRate]
      properties:
        date:
          type: string
          format: date
        visits:
          type: [array, 'null']
          description: Completed visits per department, one entry per department in `departments` (0 included). Null when there's no data for the day.
          items:
            type: object
            required: [departmentId, count]
            properties:
              departmentId:
                type: string
                format: uuid
              count:
                type: integer
                minimum: 0
        averageWaitMinutes:
          type: [number, 'null']
          minimum: 0
        noShowRate:
          type: [number, 'null']
          minimum: 0
          maximum: 1

    AuditAction:
      type: string
      enum:
        - LOGIN
        - LOGIN_FAILED
        - LOGOUT
        - PATIENT_REGISTERED
        - APPOINTMENT_BOOKED
        - APPOINTMENT_CANCELLED
        - CHECK_IN
        - VISIT_STARTED
        - VISIT_COMPLETED
        - NOTES_VIEWED
        - NOTES_SAVED
        - TEST_ORDERED
        - RESULT_UPLOADED
        - RESULT_RELEASED
        - RESULT_VIEWED
        - STAFF_CREATED
        - STAFF_ROLES_CHANGED
        - STAFF_DEACTIVATED
        - STAFF_REACTIVATED
        - DEPARTMENT_CHANGED
        - CLINIC_CHANGED
        - CLINIC_STAFF_CHANGED
        - ACCESS_DENIED

    AuditEntityType:
      type: string
      enum: [ACCOUNT, APPOINTMENT, VISIT_NOTES, TEST_ORDER, DEPARTMENT, CLINIC]

    AuditEntry:
      type: object
      required: [id, occurredAt, actor, action, outcome, entityType, entityId, ip]
      properties:
        id:
          type: string
        occurredAt:
          type: string
          format: date-time
        actor:
          description: Null when nobody was signed in, e.g. a failed login with an unknown number
          oneOf:
            - type: 'null'
            - type: object
              required: [id, name, type]
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                type:
                  $ref: '../openapi.yaml#/components/schemas/AccountType'
        action:
          $ref: '#/components/schemas/AuditAction'
        outcome:
          type: string
          enum: [SUCCESS, DENIED, FAILED]
        entityType:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/AuditEntityType'
        entityId:
          type: [string, 'null']
        ip:
          type: [string, 'null']

    AuditPage:
      type: object
      required: [entries, nextCursor]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        nextCursor:
          type: [string, 'null']
          description: Pass as `cursor` for the next 50; null on the last page
