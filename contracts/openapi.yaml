openapi: 3.1.0
info:
  title: Wasla API
  version: 0.1.0
  description: |
    Every endpoint the patient app, the hospital dashboard and the gateway use.
    Change this file first, then the code.

    ## Who serves what
    Every operation has `x-service` (`auth` or `core`) and `x-roles` (who may call it).
    Traefik sends `/auth/*` to the auth service and everything else to the core.
    The AI service is not in this file: only the core calls it, inside the Docker network.

    ## Forward-auth (the auth check)
    - Traefik calls `GET /auth/check` on the auth service before every request,
      except the public auth endpoints (register, verify-phone, resend-code, login).
    - The client sends `Authorization: Bearer <session token>`. Traefik passes it to the check.
    - `200`: the session exists, hasn't expired or been revoked, and the account is active.
      Traefik copies these response headers onto the request it sends to the core:
      - `X-User-Id`: the account's UUID
      - `X-User-Type`: `PATIENT` or `STAFF`
      - `X-User-Roles`: comma-separated staff roles (`RECEPTIONIST`, `DOCTOR`, `LAB`, `ADMIN`); empty for patients
    - `401`: Traefik returns the 401 to the client and the core never sees the request.
    - If the auth service is down or slow, Traefik refuses the request (fails closed).
    - Traefik removes any `X-User-*` headers the client sent, so they can't be faked.
    - The core trusts these headers for "logged in, active, right role". It still checks
      that the record belongs to the caller.

    ## Rules for every endpoint
    - Times are UTC, ISO 8601 with `Z`. Query parameters named `date` are calendar
      days in Africa/Cairo time (`YYYY-MM-DD`).
    - Bilingual text is an object `{ ar, en }`.
    - Every error uses the `Error` body. Apps show a message based on `error.code`.
    - A record that exists but isn't the caller's returns `404 NOT_FOUND`, the same as one
      that doesn't exist.
    - The wrong role returns `403 FORBIDDEN`.

servers:
  - url: http://localhost:8080
    description: Local gateway (docker compose)
  - url: http://localhost:4010
    description: Mock server (pnpm mock)

security:
  - session: []

tags:
  - name: Health
  - name: Auth
  - name: Booking
  - name: Queue
  - name: Journey
  - name: Visit notes
  - name: Tests and results
  - name: Chatbot
  - name: Staff
  - name: Hospital setup
  - name: Statistics
  - name: Audit log

paths:
  # ---------------------------------------------------------------- health
  /auth/health:
    get:
      tags: [Health]
      summary: Auth service health
      operationId: authHealth
      x-service: auth
      x-roles: [public]
      security: []
      responses:
        '200':
          description: The auth service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /health:
    get:
      tags: [Health]
      summary: Core service health
      description: Behind the auth check like every core route. Uptime Kuma calls the core directly inside Docker instead.
      operationId: coreHealth
      x-service: core
      x-roles: [PATIENT, RECEPTIONIST, DOCTOR, LAB, ADMIN]
      responses:
        '200':
          description: The core service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------- auth service
  /auth/register:
    post:
      tags: [Auth]
      summary: Patient sign-up
      description: Creates an unverified patient account and "sends" a 6-digit code (simulated SMS).
      operationId: register
      x-service: auth
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created, code sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSent'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: '`PHONE_TAKEN`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/verify-phone:
    post:
      tags: [Auth]
      summary: Confirm the phone number with the 6-digit code
      operationId: verifyPhone
      x-service: auth
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPhoneRequest'
      responses:
        '204':
          description: Phone verified. The patient can now log in.
        '400':
          description: '`VALIDATION_FAILED`, `CODE_INVALID` or `CODE_EXPIRED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/resend-code:
    post:
      tags: [Auth]
      summary: Send a new verification code
      operationId: resendCode
      x-service: auth
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  $ref: '#/components/schemas/Phone'
      responses:
        '202':
          description: A new code was sent. Also returned for unknown or already verified numbers, so it doesn't reveal which numbers are registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSent'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in (patients, from the app)
      description: |
        Phone number and password. Patients only: a staff account's phone gets
        `INVALID_CREDENTIALS` (staff use `POST /auth/staff/login`). Patients must
        have verified their phone first.
      operationId: login
      x-service: auth
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: '`INVALID_CREDENTIALS` (wrong phone or password, or account inactive)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`PHONE_NOT_VERIFIED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/staff/login:
    post:
      tags: [Auth]
      summary: Log in (staff, from the website)
      description: |
        Work email and password, matched without regard to case. Staff only: a
        patient account can't log in here. Staff accounts are created by an admin,
        so there's no phone code.
      operationId: staffLogin
      x-service: auth
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: '`INVALID_CREDENTIALS` (wrong email or password, or account inactive)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out (ends this session)
      operationId: logout
      x-service: auth
      x-roles: [PATIENT, RECEPTIONIST, DOCTOR, LAB, ADMIN]
      responses:
        '204':
          description: Session ended
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: The logged-in user
      operationId: getMe
      x-service: auth
      x-roles: [PATIENT, RECEPTIONIST, DOCTOR, LAB, ADMIN]
      responses:
        '200':
          description: The current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/check:
    get:
      tags: [Auth]
      summary: Forward-auth check (called by Traefik only)
      description: See "Forward-auth" at the top of this file. Apps never call this.
      operationId: authCheck
      x-service: auth
      x-roles: [gateway]
      responses:
        '200':
          description: Session valid. The headers are copied onto the request sent to the core.
          headers:
            X-User-Id:
              schema:
                type: string
                format: uuid
            X-User-Type:
              schema:
                $ref: '#/components/schemas/AccountType'
            X-User-Roles:
              description: Comma-separated staff roles. Empty for patients.
              schema:
                type: string
                examples: ['DOCTOR']
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------- staff accounts (auth, admins)
  /auth/staff:
    get:
      tags:
        - Staff
      summary: List staff accounts
      description: Every staff account, active and inactive, sorted by name. Patients are never listed.
      operationId: listStaff
      x-service: auth
      x-roles:
        - ADMIN
      parameters:
        - name: q
          in: query
          description: Part of a name, work email or phone number
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          description: Only active or only inactive accounts; both when left out
          schema:
            type: string
            enum:
              - active
              - inactive
      responses:
        '200':
          description: The matching staff
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffMember'
              example:
                - id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000001
                  name: Demo Admin
                  email: admin@wasla.test
                  phone: '+201000000001'
                  roles:
                    - ADMIN
                  active: true
                  createdAt: 2026-10-01T08:00:00Z
                - id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000011
                  name: Dr. Rania Mostafa
                  email: rania.mostafa@wasla.test
                  phone: null
                  roles:
                    - DOCTOR
                  active: true
                  createdAt: 2026-10-01T08:00:00Z
                - id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000012
                  name: Dr. Karim Adel
                  email: karim.adel@wasla.test
                  phone: null
                  roles:
                    - DOCTOR
                    - ADMIN
                  active: true
                  createdAt: 2026-10-01T08:00:00Z
                - id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000013
                  name: Dr. Salma Fawzy
                  email: salma.fawzy@wasla.test
                  phone: '+201000000013'
                  roles:
                    - DOCTOR
                  active: true
                  createdAt: 2026-10-02T08:00:00Z
                - id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000014
                  name: Dr. Omar Nabil
                  email: omar.nabil@wasla.test
                  phone: null
                  roles:
                    - DOCTOR
                  active: false
                  createdAt: 2026-10-02T08:00:00Z
                - id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000021
                  name: Nadia Hassan
                  email: nadia.hassan@wasla.test
                  phone: null
                  roles:
                    - RECEPTIONIST
                  active: true
                  createdAt: 2026-10-03T08:00:00Z
                - id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000022
                  name: Youssef Samir
                  email: youssef.samir@wasla.test
                  phone: '+201000000022'
                  roles:
                    - RECEPTIONIST
                  active: true
                  createdAt: 2026-10-03T08:00:00Z
                - id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000031
                  name: Mona Farouk
                  email: mona.farouk@wasla.test
                  phone: null
                  roles:
                    - LAB
                  active: true
                  createdAt: 2026-10-04T08:00:00Z
                - id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000032
                  name: Hany Ibrahim
                  email: hany.ibrahim@wasla.test
                  phone: null
                  roles:
                    - LAB
                  active: true
                  createdAt: 2026-10-04T08:00:00Z
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Staff
      summary: Add a staff member
      description: >
        Creates an active staff account and a temporary password. The password is returned once,

        in this response only, for the admin to hand over in person; the auth service stores just its
        hash.

        Staff don't get a phone code: the admin created the account.
      operationId: createStaff
      x-service: auth
      x-roles:
        - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewStaffRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewStaffResponse'
              example:
                staff:
                  id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000099
                  name: Laila Mahmoud
                  email: laila.mahmoud@wasla.test
                  phone: '+201000000099'
                  roles:
                    - RECEPTIONIST
                  active: true
                  createdAt: 2026-11-06T10:30:00Z
                temporaryPassword: k7Qm-x2Rt-Hb9w
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`EMAIL_TAKEN`: another account has this work email. `PHONE_TAKEN`: another account
            (staff or patient) uses this number.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/staff/{staffId}/roles:
    put:
      tags:
        - Staff
      summary: Change a staff member's roles
      description: >
        Replaces the roles. Takes effect on the person's next request (the forward-auth check reads
        roles each time).

        An admin can't remove their own `ADMIN` role (403), so there is always someone who can undo a
        change.
      operationId: setStaffRoles
      x-service: auth
      x-roles:
        - ADMIN
      parameters:
        - $ref: '#/components/parameters/StaffId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffRolesRequest'
      responses:
        '200':
          description: The updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
              example:
                id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000011
                name: Dr. Rania Mostafa
                email: rania.mostafa@wasla.test
                phone: null
                roles:
                  - DOCTOR
                  - RECEPTIONIST
                active: true
                createdAt: 2026-10-01T08:00:00Z
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/staff/{staffId}/deactivate:
    post:
      tags:
        - Staff
      summary: Deactivate a staff member
      description: >
        The account can't log in any more and **every session it has is revoked at once**, so the next

        request from any of its devices gets 401. Its past records keep its name. An admin can't
        deactivate themselves (403).

        Doing it twice is harmless.
      operationId: deactivateStaff
      x-service: auth
      x-roles:
        - ADMIN
      parameters:
        - $ref: '#/components/parameters/StaffId'
      responses:
        '200':
          description: The updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
              example:
                id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000022
                name: Youssef Samir
                email: youssef.samir@wasla.test
                phone: null
                roles:
                  - RECEPTIONIST
                active: false
                createdAt: 2026-10-03T08:00:00Z
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/staff/{staffId}/reactivate:
    post:
      tags:
        - Staff
      summary: Reactivate a staff member
      description: The account can log in again with its existing password. Doing it twice is harmless.
      operationId: reactivateStaff
      x-service: auth
      x-roles:
        - ADMIN
      parameters:
        - $ref: '#/components/parameters/StaffId'
      responses:
        '200':
          description: The updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
              example:
                id: 6f1c2a10-1d1e-4c3a-9a51-0a0000000014
                name: Dr. Omar Nabil
                email: omar.nabil@wasla.test
                phone: null
                roles:
                  - DOCTOR
                active: true
                createdAt: 2026-10-02T08:00:00Z
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- booking (core)
  /departments:
    get:
      tags: [Booking]
      summary: List active departments and their clinics
      description: Patients use `kind=CLINICAL` to browse for booking. Doctors use `kind=LAB` or `kind=RADIOLOGY` to pick where a test goes.
      operationId: listDepartments
      x-service: core
      x-roles: [PATIENT, RECEPTIONIST, DOCTOR, LAB, ADMIN]
      parameters:
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/DepartmentKind'
      responses:
        '200':
          description: Departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /departments/{departmentId}/doctors:
    get:
      tags: [Booking]
      summary: Doctors who work in a department's clinics
      operationId: listDepartmentDoctors
      x-service: core
      x-roles: [PATIENT, RECEPTIONIST, ADMIN]
      parameters:
        - $ref: '#/components/parameters/DepartmentId'
      responses:
        '200':
          description: Doctors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Doctor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /doctors/{doctorId}/slots:
    get:
      tags: [Booking]
      summary: A doctor's free slots
      description: Only open slots in the future with no active appointment. Defaults to the next 14 days.
      operationId: listFreeSlots
      x-service: core
      x-roles: [PATIENT, RECEPTIONIST]
      parameters:
        - name: doctorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: First Cairo day to include. Defaults to today.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Last Cairo day to include. At most 31 days after `from`.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Free slots, earliest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /appointments:
    post:
      tags: [Booking]
      summary: Book a slot
      description: |
        Only one active booking per slot, enforced by the database. Of two people booking at the same
        moment, one gets `201` and the other `409 SLOT_TAKEN`.
        Retrying is safe: if the caller already holds this slot, the existing appointment comes back with `200`.
      operationId: bookAppointment
      x-service: core
      x-roles: [PATIENT]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slotId]
              properties:
                slotId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: The caller had already booked this slot (a retry)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '201':
          description: Booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`SLOT_TAKEN` (someone else booked it) or `SLOT_UNAVAILABLE` (blocked, cancelled or in the past)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /me/appointments:
    get:
      tags: [Booking]
      summary: The patient's own appointments
      operationId: listMyAppointments
      x-service: core
      x-roles: [PATIENT]
      parameters:
        - name: when
          in: query
          description: '`upcoming`: BOOKED and not over yet, or CHECKED_IN / IN_CONSULTATION; soonest first. `past`: everything else, most recent first.'
          schema:
            type: string
            enum: [upcoming, past]
            default: upcoming
      responses:
        '200':
          description: Appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Appointment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /appointments/{appointmentId}:
    get:
      tags: [Booking]
      summary: One appointment
      description: The patient who booked it, its doctor, or a receptionist of its clinic. Anyone else gets `404`.
      operationId: getAppointment
      x-service: core
      x-roles: [PATIENT, RECEPTIONIST, DOCTOR]
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: The appointment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /me/clinics:
    get:
      tags: [Booking]
      summary: The clinics the staff member is assigned to
      operationId: listMyClinics
      x-service: core
      x-roles: [RECEPTIONIST, DOCTOR, LAB]
      responses:
        '200':
          description: Clinics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Clinic'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /clinics/{clinicId}/appointments:
    get:
      tags: [Booking]
      summary: A clinic's appointments for one day (receptionist)
      description: Only for receptionists assigned to this clinic. No medical details.
      operationId: listClinicAppointments
      x-service: core
      x-roles: [RECEPTIONIST]
      parameters:
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CairoDate'
      responses:
        '200':
          description: Appointments, earliest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Appointment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /doctors/me/appointments:
    get:
      tags: [Booking]
      summary: The doctor's own appointments for one day
      operationId: listDoctorAppointments
      x-service: core
      x-roles: [DOCTOR]
      parameters:
        - $ref: '#/components/parameters/CairoDate'
      responses:
        '200':
          description: Appointments, earliest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Appointment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------- queue (core)
  /appointments/{appointmentId}/check-in:
    post:
      tags: [Queue]
      summary: Check a patient in (BOOKED → CHECKED_IN)
      description: |
        Receptionist of the appointment's clinic. Only on the appointment's own day (Africa/Cairo),
        at any time that day, also after the slot has ended. The patient joins their doctor's queue
        in this clinic. Another day, or a status other than `BOOKED`, is `409 INVALID_TRANSITION`.
      operationId: checkIn
      x-service: core
      x-roles: [RECEPTIONIST]
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: Checked in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'

  /clinics/{clinicId}/queue:
    get:
      tags: [Queue]
      summary: Queue board for a clinic
      description: |
        Receptionists and doctors assigned to this clinic. Who is waiting and who is with the doctor,
        for every doctor of the clinic. Each doctor has their own line: their own waiting patients, in
        check-in order. No medical details.
      operationId: getClinicQueue
      x-service: core
      x-roles: [RECEPTIONIST, DOCTOR]
      parameters:
        - $ref: '#/components/parameters/ClinicId'
      responses:
        '200':
          description: The queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueBoard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /doctors/me/queue/call-next:
    post:
      tags: [Queue]
      summary: Call the next patient (CHECKED_IN → IN_CONSULTATION)
      description: |
        Calls the earliest checked-in patient booked with the calling doctor in this clinic. The doctor
        must be assigned to the clinic (`404` otherwise) and sees one patient at a time, in any clinic.
      operationId: callNextPatient
      x-service: core
      x-roles: [DOCTOR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clinicId]
              properties:
                clinicId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: The appointment now in consultation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`QUEUE_EMPTY` (no one is waiting) or `ALREADY_IN_CONSULTATION` (finish the current visit first)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /appointments/{appointmentId}/complete:
    post:
      tags: [Queue]
      summary: Finish the visit (IN_CONSULTATION → COMPLETED)
      description: Only the appointment's own doctor. Anyone else gets `404`.
      operationId: completeVisit
      x-service: core
      x-roles: [DOCTOR]
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: Completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'

  /appointments/{appointmentId}/queue-position:
    get:
      tags: [Queue]
      summary: How many people are ahead of the patient
      operationId: getQueuePosition
      x-service: core
      x-roles: [PATIENT]
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: The patient's place in line
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuePosition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- journey (core)
  /appointments/{appointmentId}/journey:
    get:
      tags: [Journey]
      summary: Where the patient is in their visit and what to do next
      operationId: getJourney
      x-service: core
      x-roles: [PATIENT]
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: The current stage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- visit notes (core)
  /appointments/{appointmentId}/notes:
    get:
      tags: [Visit notes]
      summary: The latest version of the visit notes
      description: Only the appointment's doctor. Reading is written to the audit log.
      operationId: getVisitNotes
      x-service: core
      x-roles: [DOCTOR]
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: Latest version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitNotes'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: '`NOT_FOUND`: not the caller''s appointment, or no notes written yet'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Visit notes]
      summary: Write or edit the visit notes (saves a new version)
      description: |
        Every save adds a new version and keeps the old ones. Send the version you edited as `baseVersion`
        (`0` for the first save). If someone saved in between, you get `409 VERSION_CONFLICT`.
      operationId: saveVisitNotes
      x-service: core
      x-roles: [DOCTOR]
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveVisitNotesRequest'
      responses:
        '200':
          description: The new version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitNotes'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`VERSION_CONFLICT`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /appointments/{appointmentId}/notes/versions:
    get:
      tags: [Visit notes]
      summary: Every version of the visit notes, newest first
      operationId: listVisitNoteVersions
      x-service: core
      x-roles: [DOCTOR]
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VisitNotes'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /appointments/{appointmentId}/summary:
    get:
      tags: [Visit notes]
      summary: The patient's visit summary
      description: The patient-facing summary from the latest notes version. Available once the visit is completed.
      operationId: getVisitSummary
      x-service: core
      x-roles: [PATIENT]
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: The summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`NOT_YET_AVAILABLE`: the visit isn''t completed or has no summary yet'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------- tests and results (core)
  /appointments/{appointmentId}/tests:
    get:
      tags: [Tests and results]
      summary: Tests ordered during a visit (doctor)
      operationId: listVisitTests
      x-service: core
      x-roles: [DOCTOR]
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: Tests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TestOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Tests and results]
      summary: Order a test
      description: Only the appointment's doctor, while the visit is IN_CONSULTATION. `clinicId` is a clinic of a LAB or RADIOLOGY department.
      operationId: orderTest
      x-service: core
      x-roles: [DOCTOR]
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderTestRequest'
      responses:
        '201':
          description: Ordered (REQUESTED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestOrder'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'

  /lab/tests:
    get:
      tags: [Tests and results]
      summary: Tests ordered for the lab staff member's clinics
      operationId: listLabTests
      x-service: core
      x-roles: [LAB]
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TestStatus'
      responses:
        '200':
          description: Tests, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TestOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tests/{testId}/start:
    post:
      tags: [Tests and results]
      summary: Mark a test as started (REQUESTED → IN_PROGRESS)
      operationId: startTest
      x-service: core
      x-roles: [LAB]
      parameters:
        - $ref: '#/components/parameters/TestId'
      responses:
        '200':
          description: Started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'

  /tests/{testId}/result:
    post:
      tags: [Tests and results]
      summary: Upload the result file (IN_PROGRESS → AWAITING_REVIEW)
      description: One PDF, JPEG or PNG, at most 10 MB. Uploading again before release replaces the file.
      operationId: uploadTestResult
      x-service: core
      x-roles: [LAB]
      parameters:
        - $ref: '#/components/parameters/TestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
      responses:
        '200':
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestOrder'
        '400':
          description: '`VALIDATION_FAILED` or `FILE_TYPE_NOT_ALLOWED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '413':
          description: '`FILE_TOO_LARGE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tests/{testId}/release:
    post:
      tags: [Tests and results]
      summary: Release the result to the patient (AWAITING_REVIEW → RELEASED)
      operationId: releaseTestResult
      x-service: core
      x-roles: [DOCTOR]
      parameters:
        - $ref: '#/components/parameters/TestId'
      responses:
        '200':
          description: Released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'

  /tests/{testId}/result/file:
    get:
      tags: [Tests and results]
      summary: Download the result file
      description: |
        The ordering doctor, the lab staff of the test's clinic, or the patient once it is RELEASED.
        The core streams the file from private storage; there is never a public link.
        Before release the patient gets `404`. Every download is written to the audit log.
      operationId: downloadTestResult
      x-service: core
      x-roles: [PATIENT, DOCTOR, LAB]
      parameters:
        - $ref: '#/components/parameters/TestId'
      responses:
        '200':
          description: The file
          content:
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
            image/jpeg:
              schema:
                type: string
                contentMediaType: image/jpeg
            image/png:
              schema:
                type: string
                contentMediaType: image/png
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /me/results:
    get:
      tags: [Tests and results]
      summary: The patient's test results
      description: Tests that aren't released show only `WAITING_FOR_REVIEW`, with no file and no content.
      operationId: listMyResults
      x-service: core
      x-roles: [PATIENT]
      responses:
        '200':
          description: Results, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatientResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------- chatbot (core → ai)
  /admin/chatbot/messages:
    post:
      tags: [Chatbot]
      summary: Ask the admin assistant a question
      description: The core forwards the question to the AI service. Answers in the question's language, only from the knowledge base, with sources.
      operationId: askChatbot
      x-service: core
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        '200':
          description: The answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatbotAnswer'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: '`AI_UNAVAILABLE`: the AI service is down. Nothing else is affected.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

