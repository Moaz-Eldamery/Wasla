components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: The opaque session token from `POST /auth/login`.

  parameters:
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClinicId:
      name: clinicId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DepartmentId:
      name: departmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TestId:
      name: testId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CairoDate:
      name: date
      in: query
      description: Cairo calendar day. Defaults to today in Cairo.
      schema:
        type: string
        format: date

    StaffId:
      name: staffId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ValidationError:
      description: '`VALIDATION_FAILED`: `error.details` lists the bad fields'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: '`UNAUTHENTICATED`: no session, or it expired or was revoked'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: '`FORBIDDEN`: the caller''s role can''t do this'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: '`NOT_FOUND`: doesn''t exist, or isn''t the caller''s'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidTransition:
      description: '`INVALID_TRANSITION`: the status change isn''t allowed from the current status'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: '`RATE_LIMITED`: too many attempts. Try again after `Retry-After` seconds.'
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # ---- shared
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: English, for developers and logs. Apps show their own translated text.
            details:
              type: array
              items:
                type: object
                required: [field, problem]
                properties:
                  field:
                    type: string
                  problem:
                    type: string
      examples:
        - error:
            code: SLOT_TAKEN
            message: This slot was just booked by someone else.

    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - RATE_LIMITED
        - PHONE_TAKEN
        - EMAIL_TAKEN
        - PHONE_NOT_VERIFIED
        - INVALID_CREDENTIALS
        - CODE_INVALID
        - CODE_EXPIRED
        - SLOT_TAKEN
        - SLOT_UNAVAILABLE
        - INVALID_TRANSITION
        - QUEUE_EMPTY
        - ALREADY_IN_CONSULTATION
        - VERSION_CONFLICT
        - NOT_YET_AVAILABLE
        - FILE_TYPE_NOT_ALLOWED
        - FILE_TOO_LARGE
        - AI_UNAVAILABLE
        - INTERNAL

    LocalizedText:
      type: object
      required: [ar, en]
      properties:
        ar:
          type: string
        en:
          type: string

    Phone:
      type: string
      description: Egyptian mobile number in E.164 form
      pattern: '^\+201[0-9]{9}$'
      examples: ['+201000000001']

    AccountType:
      type: string
      enum: [PATIENT, STAFF]

    StaffRole:
      type: string
      enum: [RECEPTIONIST, DOCTOR, LAB, ADMIN]

    # ---- auth
    RegisterRequest:
      type: object
      required: [name, phone, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          $ref: '#/components/schemas/Phone'
        password:
          type: string
          minLength: 8
          maxLength: 128

    CodeSent:
      type: object
      required: [expiresAt]
      properties:
        expiresAt:
          type: string
          format: date-time
        simulatedCode:
          type: string
          pattern: '^[0-9]{6}$'
          description: Prototype only (SMS is simulated). The app shows this code on screen. Removed when a real SMS provider is used.

    VerifyPhoneRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          $ref: '#/components/schemas/Phone'
        code:
          type: string
          pattern: '^[0-9]{6}$'

    LoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone:
          $ref: '#/components/schemas/Phone'
        password:
          type: string

    StaffLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string

    LoginResponse:
      type: object
      required: [token, expiresAt, user]
      properties:
        token:
          type: string
          description: 'Send as `Authorization: Bearer <token>`.'
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, type, name, phone, email, roles]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/AccountType'
        name:
          type: string
        phone:
          description: Always set for patients (they log in with it); optional for staff
          oneOf:
            - $ref: '#/components/schemas/Phone'
            - type: 'null'
        email:
          description: Staff only (they log in with it); `null` for patients
          type: [string, 'null']
          format: email
        roles:
          type: array
          description: Empty for patients
          items:
            $ref: '#/components/schemas/StaffRole'

    # ---- hospital setup
    DepartmentKind:
      type: string
      enum: [CLINICAL, LAB, RADIOLOGY]

    Department:
      type: object
      required: [id, kind, name, clinics]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/DepartmentKind'
        name:
          $ref: '#/components/schemas/LocalizedText'
        clinics:
          type: array
          items:
            $ref: '#/components/schemas/Clinic'

    Clinic:
      type: object
      required: [id, departmentId, name, building, floor, directions]
      properties:
        id:
          type: string
          format: uuid
        departmentId:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/LocalizedText'
        building:
          type: string
        floor:
          type: string
        directions:
          $ref: '#/components/schemas/LocalizedText'

    Doctor:
      type: object
      required: [id, name, clinics]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        clinics:
          type: array
          items:
            $ref: '#/components/schemas/Clinic'

    # ---- booking
    Slot:
      type: object
      required: [id, doctorId, clinic, startsAt, endsAt]
      properties:
        id:
          type: string
          format: uuid
        doctorId:
          type: string
          format: uuid
        clinic:
          $ref: '#/components/schemas/Clinic'
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time

    AppointmentStatus:
      type: string
      enum: [BOOKED, CHECKED_IN, IN_CONSULTATION, COMPLETED, CANCELLED, NO_SHOW]

    Appointment:
      type: object
      description: No medical details. Receptionists see exactly this.
      required: [id, status, startsAt, endsAt, patient, doctor, clinic, bookedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        patient:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        doctor:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        clinic:
          $ref: '#/components/schemas/Clinic'
        bookedAt:
          type: string
          format: date-time
        checkedInAt:
          type: [string, 'null']
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time

    # ---- queue
    QueueItem:
      type: object
      required: [appointmentId, patientName, doctorId, doctorName, checkedInAt]
      properties:
        appointmentId:
          type: string
          format: uuid
        patientName:
          type: string
        doctorId:
          type: string
          format: uuid
        doctorName:
          type: string
        checkedInAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time

    QueueBoard:
      type: object
      required: [clinicId, waiting, inConsultation]
      properties:
        clinicId:
          type: string
          format: uuid
        waiting:
          description: CHECKED_IN, earliest check-in first
          type: array
          items:
            $ref: '#/components/schemas/QueueItem'
        inConsultation:
          description: IN_CONSULTATION, earliest start first
          type: array
          items:
            $ref: '#/components/schemas/QueueItem'

    QueuePosition:
      type: object
      required: [appointmentId, status, peopleAhead]
      properties:
        appointmentId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        peopleAhead:
          type: [integer, 'null']
          minimum: 0
          description: |
            Patients waiting for the same doctor in the same clinic who checked in earlier.
            Only while CHECKED_IN; `null` otherwise

    # ---- journey
    JourneyStageCode:
      type: string
      enum: [BOOKED, CHECKED_IN, WITH_DOCTOR, TEST_ORDERED, RESULT_READY, DONE]

    Journey:
      type: object
      required: [appointmentId, stage, title, nextStep, location]
      properties:
        appointmentId:
          type: string
          format: uuid
        stage:
          $ref: '#/components/schemas/JourneyStageCode'
        title:
          $ref: '#/components/schemas/LocalizedText'
        nextStep:
          $ref: '#/components/schemas/LocalizedText'
        location:
          description: Where to go now; `null` when there's nowhere to go
          oneOf:
            - $ref: '#/components/schemas/Clinic'
            - type: 'null'

    # ---- visit notes
    VisitNotes:
      type: object
      required: [appointmentId, version, clinicalNotes, patientSummary, authorName, createdAt]
      properties:
        appointmentId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        clinicalNotes:
          type: string
          description: Doctor only. Never shown to the patient.
        patientSummary:
          type: [string, 'null']
          description: What the patient sees once the visit is completed
        authorName:
          type: string
        createdAt:
          type: string
          format: date-time

    SaveVisitNotesRequest:
      type: object
      required: [baseVersion, clinicalNotes]
      properties:
        baseVersion:
          type: integer
          minimum: 0
        clinicalNotes:
          type: string
          minLength: 1
          maxLength: 20000
        patientSummary:
          type: [string, 'null']
          maxLength: 5000

    VisitSummary:
      type: object
      required: [appointmentId, doctorName, completedAt, summary]
      properties:
        appointmentId:
          type: string
          format: uuid
        doctorName:
          type: string
        completedAt:
          type: string
          format: date-time
        summary:
          type: string

    # ---- tests and results
    TestStatus:
      type: string
      enum: [REQUESTED, IN_PROGRESS, AWAITING_REVIEW, RELEASED]

    OrderTestRequest:
      type: object
      required: [clinicId, testName]
      properties:
        clinicId:
          type: string
          format: uuid
        testName:
          type: string
          minLength: 1
          maxLength: 200
        instructions:
          type: [string, 'null']
          maxLength: 2000

    TestOrder:
      type: object
      description: Staff view of a test (doctor and lab)
      required: [id, appointmentId, patientName, testName, clinic, status, orderedByName, orderedAt]
      properties:
        id:
          type: string
          format: uuid
        appointmentId:
          type: string
          format: uuid
        patientName:
          type: string
        testName:
          type: string
        instructions:
          type: [string, 'null']
        clinic:
          $ref: '#/components/schemas/Clinic'
        status:
          $ref: '#/components/schemas/TestStatus'
        orderedByName:
          type: string
        orderedAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        releasedAt:
          type: [string, 'null']
          format: date-time
        file:
          oneOf:
            - $ref: '#/components/schemas/ResultFile'
            - type: 'null'

    ResultFile:
      type: object
      required: [fileName, contentType, sizeBytes, uploadedAt]
      properties:
        fileName:
          type: string
        contentType:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
        sizeBytes:
          type: integer
          maximum: 10485760
        uploadedAt:
          type: string
          format: date-time

    PatientResult:
      type: object
      description: Patient view. Nothing from the result is included until it is released.
      required: [testId, appointmentId, testName, orderedAt, status]
      properties:
        testId:
          type: string
          format: uuid
        appointmentId:
          type: string
          format: uuid
        testName:
          type: string
        orderedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [WAITING_FOR_REVIEW, RELEASED]
        releasedAt:
          type: [string, 'null']
          format: date-time
        file:
          description: Only when RELEASED. Download it with `GET /tests/{testId}/result/file`.
          oneOf:
            - $ref: '#/components/schemas/ResultFile'
            - type: 'null'

    # ---- chatbot
    ChatbotAnswer:
      type: object
      required: [status, answer, language, sources]
      properties:
        status:
          type: string
          enum: [ANSWERED, NO_INFORMATION]
          description: '`NO_INFORMATION` means the assistant said "I don''t have that information"'
        answer:
          type: string
        language:
          type: string
          enum: [ar, en]
        sources:
          type: array
          description: The knowledge-base entries the answer used. Empty when `NO_INFORMATION`.
          items:
            type: object
            required: [entryId, title]
            properties:
              entryId:
                type: string
              title:
                $ref: '#/components/schemas/LocalizedText'

    # ---- admin
    StaffMember:
      type: object
      required:
        - id
        - name
        - email
        - phone
        - roles
        - active
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
          description: Work email, stored lowercase. Staff log in to the website with it.
        phone:
          description: Optional contact number, never a login
          oneOf:
            - $ref: '#/components/schemas/Phone'
            - type: 'null'
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/StaffRole'
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
    NewStaffRequest:
      type: object
      required:
        - name
        - email
        - roles
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
          description: Work email; matched without regard to case
        phone:
          $ref: '#/components/schemas/Phone'
          description: Optional
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/StaffRole'
    NewStaffResponse:
      type: object
      required:
        - staff
        - temporaryPassword
      properties:
        staff:
          $ref: '#/components/schemas/StaffMember'
        temporaryPassword:
          type: string
          description: Shown to the admin once, e.g. `k7Qm-x2Rt-Hb9w` (12 characters without look-alikes).
            Never returned again and never logged.
    StaffRolesRequest:
      type: object
      required:
        - roles
      properties:
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/StaffRole'
    AdminDepartment:
      type: object
      required:
        - id
        - kind
        - name
        - active
        - clinics
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/DepartmentKind'
        name:
          $ref: '#/components/schemas/LocalizedText'
        active:
          type: boolean
        clinics:
          type: array
          description: Inactive ones included, by English name
          items:
            $ref: '#/components/schemas/AdminClinic'
    AdminClinic:
      type: object
      required:
        - id
        - departmentId
        - name
        - building
        - floor
        - directions
        - active
        - staff
      properties:
        id:
          type: string
          format: uuid
        departmentId:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/LocalizedText'
        building:
          type: string
        floor:
          type: string
        directions:
          $ref: '#/components/schemas/LocalizedText'
        active:
          type: boolean
          description: The clinic's own setting. It is bookable only when it and its department are both active.
        staff:
          type: array
          description: Everyone assigned, by name
          items:
            $ref: '#/components/schemas/AssignedStaff'
    AssignedStaff:
      type: object
      required:
        - id
        - name
        - roles
        - active
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/StaffRole'
        active:
          type: boolean
    NewDepartmentRequest:
      type: object
      required:
        - kind
        - name
      properties:
        kind:
          $ref: '#/components/schemas/DepartmentKind'
        name:
          $ref: '#/components/schemas/RequiredText'
    DepartmentNameRequest:
      type: object
      required:
        - name
      properties:
        name:
          $ref: '#/components/schemas/RequiredText'
    ClinicRequest:
      type: object
      required:
        - name
        - building
        - floor
        - directions
      properties:
        name:
          $ref: '#/components/schemas/RequiredText'
        building:
          type: string
          minLength: 1
          maxLength: 40
        floor:
          type: string
          minLength: 1
          maxLength: 40
        directions:
          $ref: '#/components/schemas/RequiredText'
    RequiredText:
      type: object
      description: '`{ ar, en }` where both sides are filled in (1 to 200 characters)'
      required:
        - ar
        - en
      properties:
        ar:
          type: string
          minLength: 1
          maxLength: 200
        en:
          type: string
          minLength: 1
          maxLength: 200
    Statistics:
      type: object
      required:
        - from
        - to
        - departmentId
        - departments
        - days
        - totals
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        departmentId:
          type:
            - string
            - 'null'
          format: uuid
          description: The department filter, or null for all
        departments:
          type: array
          description: The clinical departments counted, in the fixed order of `GET /admin/departments`.
            Inactive ones are included while they have visits in the range.
          items:
            type: object
            required:
              - id
              - name
            properties:
              id:
                type: string
                format: uuid
              name:
                $ref: '#/components/schemas/LocalizedText'
        days:
          type: array
          items:
            $ref: '#/components/schemas/StatisticsDay'
        totals:
          type: object
          description: The whole range. Wait and no-show rate are weighted by the day's appointments, not an
            average of the days.
          required:
            - visits
            - averageWaitMinutes
            - noShowRate
          properties:
            visits:
              type:
                - integer
                - 'null'
              minimum: 0
            averageWaitMinutes:
              type:
                - number
                - 'null'
              minimum: 0
            noShowRate:
              type:
                - number
                - 'null'
              minimum: 0
              maximum: 1
    StatisticsDay:
      type: object
      required:
        - date
        - visits
        - averageWaitMinutes
        - noShowRate
      properties:
        date:
          type: string
          format: date
        visits:
          type:
            - array
            - 'null'
          description: Completed visits per department, one entry per department in `departments` (0
            included). Null when there's no data for the day.
          items:
            type: object
            required:
              - departmentId
              - count
            properties:
              departmentId:
                type: string
                format: uuid
              count:
                type: integer
                minimum: 0
        averageWaitMinutes:
          type:
            - number
            - 'null'
          minimum: 0
        noShowRate:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 1
    AuditAction:
      type: string
      enum:
        - LOGIN
        - LOGIN_FAILED
        - LOGOUT
        - PATIENT_REGISTERED
        - PHONE_VERIFIED
        - ACCESS_DENIED
        - APPOINTMENT_BOOKED
        - APPOINTMENT_CANCELLED
        - CHECK_IN
        - VISIT_STARTED
        - VISIT_COMPLETED
        - RECORD_VIEWED
        - NOTES_VIEWED
        - NOTES_SAVED
        - TEST_ORDERED
        - TEST_STARTED
        - RESULT_UPLOADED
        - RESULT_RELEASED
        - RESULT_VIEWED
        - STAFF_CREATED
        - STAFF_ROLES_CHANGED
        - STAFF_DEACTIVATED
        - STAFF_REACTIVATED
        - DEPARTMENT_CHANGED
        - CLINIC_CHANGED
        - CLINIC_STAFF_CHANGED
        - OTHER
      description: What happened, grouped from the dotted names the services store (`auth.login`,
        `appointment.check_in`, ...). `RECORD_VIEWED` is any other read of a patient record
        (appointment, queue, journey, test). `OTHER` is a stored name the core does not group yet. The
        mapping is in `services/core/src/modules/admin-reporting/audit-actions.ts`.
    AuditEntityType:
      type: string
      enum:
        - ACCOUNT
        - APPOINTMENT
        - SLOT
        - TEST_ORDER
        - DEPARTMENT
        - CLINIC
    AuditEntry:
      type: object
      required:
        - id
        - occurredAt
        - actor
        - action
        - outcome
        - entityType
        - entityId
        - ip
      properties:
        id:
          type: string
        occurredAt:
          type: string
          format: date-time
        actor:
          description: Null when nobody was signed in, e.g. a failed login with an unknown number
          oneOf:
            - type: 'null'
            - type: object
              required:
                - id
                - name
                - type
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                type:
                  $ref: '#/components/schemas/AccountType'
        action:
          $ref: '#/components/schemas/AuditAction'
        outcome:
          type: string
          enum:
            - SUCCESS
            - DENIED
            - FAILED
        entityType:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/AuditEntityType'
        entityId:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
    AuditPage:
      type: object
      required:
        - entries
        - nextCursor
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        nextCursor:
          type:
            - string
            - 'null'
          description: Pass as `cursor` for the next 50; null on the last page
