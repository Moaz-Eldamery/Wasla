# Production overlay. Requires a real DOMAIN, ACME_EMAIL, GATEWAY_PORT=80,
# and production secrets in the VM's untracked .env file.
services:
  gateway:
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=wasla-edge
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --ping=true
      - --accesslog=true
      - --certificatesresolvers.wasla.acme.email=${ACME_EMAIL:?Set ACME_EMAIL in the VM .env}
      - --certificatesresolvers.wasla.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.wasla.acme.httpchallenge.entrypoint=web
    ports:
      - "443:443"
    volumes:
      - letsencrypt:/letsencrypt

  auth:
    labels:
      - traefik.http.routers.auth-api.rule=Host(`${DOMAIN:?Set DOMAIN in the VM .env}`) && PathPrefix(`/api/auth`)
      - traefik.http.routers.auth-api.entrypoints=websecure
      - traefik.http.routers.auth-api.priority=110
      - traefik.http.routers.auth-api.tls=true
      - traefik.http.routers.auth-api.tls.certresolver=wasla
      - traefik.http.routers.auth-api.middlewares=api-prefix,strip-identity,rate-limit,body-limit
      - traefik.http.routers.auth-api.service=auth

  core:
    labels:
      - traefik.http.middlewares.api-prefix.stripprefix.prefixes=/api
      - traefik.http.routers.core-api.rule=Host(`${DOMAIN:?Set DOMAIN in the VM .env}`) && PathPrefix(`/api`)
      - traefik.http.routers.core-api.entrypoints=websecure
      - traefik.http.routers.core-api.priority=100
      - traefik.http.routers.core-api.tls=true
      - traefik.http.routers.core-api.tls.certresolver=wasla
      - traefik.http.routers.core-api.middlewares=api-prefix,strip-identity,rate-limit,body-limit,auth-check
      - traefik.http.routers.core-api.service=core

  dashboard:
    build:
      context: .
      dockerfile: apps/hospital-dashboard/Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    networks: [edge]
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`${DOMAIN:?Set DOMAIN in the VM .env}`)
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.priority=10
      - traefik.http.routers.dashboard.tls=true
      - traefik.http.routers.dashboard.tls.certresolver=wasla
      - traefik.http.services.dashboard.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  ai-sync:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    command: ["python", "-m", "app.admin_chatbot.sync_knowledge_base"]
    environment:
      DATABASE_URL: postgresql://wasla_ai:${AI_DB_PASSWORD:?}@postgres:5432/wasla_ai
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set a Gemini key with free text-embedding quota before syncing}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      GEMINI_EMBEDDING_DIMENSIONS: ${GEMINI_EMBEDDING_DIMENSIONS:-1536}
    depends_on:
      postgres:
        condition: service_healthy
      ai-migrate:
        condition: service_completed_successfully
    networks: [ai, egress]
    profiles: [knowledge-base-sync]
    restart: "no"

volumes:
  letsencrypt:
